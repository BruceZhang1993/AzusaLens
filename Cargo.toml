[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/capture",
    "crates/hotkey",
    "crates/ocr",
    "crates/annotation",
    "crates/config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Azusa Lens contributors"]
repository = "https://github.com/BruceZhang1993/AzusaLens"
license = "Apache-2.0"

[workspace.dependencies]
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
slint-build = "=1.17.1"
notify-rust = "=4.18.0"
