name: Fix capture workflow polish

on:
  push:
    branches:
      - feat/capture-workflow-polish
    paths:
      - tools/fix_capture_workflow_polish.py
      - .github/workflows/fix-capture-workflow-polish.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/capture-workflow-polish
          fetch-depth: 0

      - name: Apply Slint syntax fix
        run: python3 tools/fix_capture_workflow_polish.py

      - name: Check patch
        run: git diff --check

      - name: Remove one-time patch files
        run: |
          rm tools/fix_capture_workflow_polish.py
          rm .github/workflows/fix-capture-workflow-polish.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): compile adjustable capture selection"
          git push origin HEAD:feat/capture-workflow-polish
