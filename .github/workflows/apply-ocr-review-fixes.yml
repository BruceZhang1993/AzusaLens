name: Apply OCR review fixes

on:
  push:
    branches: [feat/fast-local-ocr]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply OCR review fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/fast-local-ocr
          fetch-depth: 0

      - name: Apply stale-result fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/main.rs')
          text = path.read_text()

          # A new OCR run supersedes any previous result immediately.
          handler_start = text.index('ui.on_ocr_requested')
          running_idx = text.index('ui.set_ocr_running(true);', handler_start)
          line_start = text.rfind('\n', 0, running_idx) + 1
          indent = text[line_start:running_idx]
          text = (
              text[:running_idx]
              + 'clear_ocr_results(&ui);\n'
              + indent
              + 'ui.set_ocr_running(true);'
              + text[running_idx + len('ui.set_ocr_running(true);'):]
          )

          # A failed rerun must not leave copyable/re-displayable stale results.
          error_status = 'ui.set_status_text(format!("Local OCR failed · {error}").into());'
          error_idx = text.index(error_status)
          overlay_idx = text.rfind('ui.set_ocr_overlay_visible(false);', 0, error_idx)
          if overlay_idx < 0:
              raise SystemExit('OCR failure overlay anchor not found')
          text = (
              text[:overlay_idx]
              + 'clear_ocr_results(&ui);'
              + text[overlay_idx + len('ui.set_ocr_overlay_visible(false);'):]
          )

          # set_editor_frame is the commit point for a new capture or any annotation mutation.
          # Centralize OCR invalidation there so every pixel-changing edit bumps the epoch.
          for line in [
              '    ui.set_ocr_epoch(ui.get_ocr_epoch().wrapping_add(1));\n',
              '    ui.set_ocr_running(false);\n',
              '    ui.set_ocr_overlay_visible(false);\n',
              '    ui.set_ocr_line_count(0);\n',
              '    ui.set_ocr_text("".into());\n',
          ]:
              finish_start = text.index('fn finish_capture(')
              editor_frame_start = text.index('fn set_editor_frame(', finish_start)
              pos = text.find(line, finish_start, editor_frame_start)
              if pos < 0:
                  raise SystemExit(f'finish_capture OCR reset anchor not found: {line.strip()}')
              text = text[:pos] + text[pos + len(line):]

          editor_frame_start = text.index('fn set_editor_frame(')
          body_start = text.index(') {', editor_frame_start) + len(') {')
          text = text[:body_start] + '\n    invalidate_ocr_results(ui);' + text[body_start:]

          helper_marker = 'fn frame_to_image(frame: &CapturedFrame) -> Image {'
          helper_pos = text.index(helper_marker)
          helpers = '''fn clear_ocr_results(ui: &AppWindow) {
              ui.set_ocr_overlay_visible(false);
              ui.set_ocr_line_count(0);
              ui.set_ocr_text("".into());
              ui.set_ocr_items(ModelRc::new(VecModel::from(Vec::<OcrOverlayItem>::new())));
          }

          fn invalidate_ocr_results(ui: &AppWindow) {
              ui.set_ocr_epoch(ui.get_ocr_epoch().wrapping_add(1));
              ui.set_ocr_running(false);
              clear_ocr_results(ui);
          }

          '''
          text = text[:helper_pos] + helpers + text[helper_pos:]
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit source and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-ocr-review-fixes.yml
          git add apps/desktop/src/main.rs
          git commit -m 'fix: invalidate stale OCR results after editor changes'
          git push origin HEAD:feat/fast-local-ocr
