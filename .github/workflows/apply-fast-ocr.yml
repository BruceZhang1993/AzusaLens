name: Apply fast OCR integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/fast-local-ocr'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/fast-local-ocr
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake libclang-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl-dev libgbm-dev libx11-xcb-dev libxcursor-dev \
            libxkbcommon-x11-dev libxkbcommon-dev libx11-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Integrate OCR worker and overlays
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: expected source pattern not found')
              return text.replace(old, new, 1)

          main_path = Path('apps/desktop/src/main.rs')
          main = main_path.read_text()
          main = replace_once(
              main,
              '    rc::Rc,\n    time::Duration,',
              '    rc::Rc,\n    sync::mpsc::{self, TryRecvError},\n    thread,\n    time::Duration,',
              'std imports',
          )
          main = replace_once(
              main,
              'use azusa_ocr::{default_engine_name, validation_message as ocr_validation_message};',
              'use azusa_ocr::{FastOcrEngine, OcrEngine, OcrImage, OcrResult, default_engine_name};',
              'OCR imports',
          )
          main = replace_once(
              main,
              '    ComponentHandle, Image, PhysicalPosition, Rgba8Pixel, SharedPixelBuffer, Timer, TimerMode,',
              '    ComponentHandle, Image, ModelRc, PhysicalPosition, Rgba8Pixel, SharedPixelBuffer, Timer,\n    TimerMode, VecModel,',
              'Slint imports',
          )
          marker = 'enum CaptureOrigin {\n    MainWindow,\n    Background,\n}\n'
          main = replace_once(
              main,
              marker,
              marker + '''\nstruct OcrJob {\n    epoch: i32,\n    image: OcrImage,\n}\n\nstruct OcrWorkerMessage {\n    epoch: i32,\n    result: Result<OcrResult, String>,\n}\n''',
              'worker structs',
          )
          startup = '    let capture_active = Rc::new(Cell::new(false));\n\n'
          main = replace_once(
              main,
              startup,
              startup + '''    let (ocr_job_tx, ocr_job_rx) = mpsc::channel::<OcrJob>();\n    let (ocr_result_tx, ocr_result_rx) = mpsc::channel::<OcrWorkerMessage>();\n    thread::Builder::new()\n        .name("azusa-fast-ocr".to_owned())\n        .spawn(move || {\n            let mut engine = FastOcrEngine::new();\n            while let Ok(job) = ocr_job_rx.recv() {\n                let result = engine.recognize(&job.image).map_err(|error| error.to_string());\n                if ocr_result_tx.send(OcrWorkerMessage { epoch: job.epoch, result }).is_err() {\n                    break;\n                }\n            }\n        })\n        .expect("failed to start local OCR worker");\n\n''',
              'worker startup',
          )

          ocr_start = main.index('    {\n        let weak = ui.as_weak();\n        ui.on_ocr_requested')
          ocr_end = main.index('    {\n        let start_capture = Rc::clone(&start_capture);', ocr_start)
          main = main[:ocr_start] + '''    {\n        let weak = ui.as_weak();\n        let latest_frame = Rc::clone(&latest_frame);\n        let ocr_job_tx = ocr_job_tx.clone();\n        ui.on_ocr_requested(move || {\n            let Some(ui) = weak.upgrade() else { return; };\n            if ui.get_ocr_running() { return; }\n            let frame = latest_frame.borrow();\n            let Some(frame) = frame.as_ref() else {\n                ui.set_status_text("Nothing to OCR · capture a region first".into());\n                return;\n            };\n            let image = match OcrImage::new(frame.width(), frame.height(), frame.rgba().to_vec()) {\n                Ok(image) => image,\n                Err(error) => {\n                    ui.set_status_text(format!("OCR input failed · {error}").into());\n                    return;\n                }\n            };\n            if let Err(error) = ocr_job_tx.send(OcrJob { epoch: ui.get_ocr_epoch(), image }) {\n                ui.set_status_text(format!("OCR worker unavailable · {error}").into());\n                return;\n            }\n            ui.set_ocr_running(true);\n            ui.set_status_text("Fast local OCR running · first use may download about 16 MiB of PP-OCRv6 models".into());\n        });\n    }\n\n    {\n        let weak = ui.as_weak();\n        ui.on_copy_ocr_requested(move || {\n            let Some(ui) = weak.upgrade() else { return; };\n            let text = ui.get_ocr_text();\n            if text.is_empty() {\n                ui.set_status_text("No OCR text to copy".into());\n                return;\n            }\n            match copy_text_to_clipboard(text.as_str()) {\n                Ok(()) => ui.set_status_text("OCR text copied to the clipboard".into()),\n                Err(error) => ui.set_status_text(format!("OCR clipboard failed · {error}").into()),\n            }\n        });\n    }\n\n''' + main[ocr_end:]

          event_loop = '\n    slint::run_event_loop()\n}'
          event_at = main.rfind(event_loop)
          if event_at < 0:
              raise SystemExit('event loop anchor not found')
          timer = '''\n    let ocr_result_timer = Timer::default();\n    {\n        let weak = ui.as_weak();\n        ocr_result_timer.start(TimerMode::Repeated, Duration::from_millis(40), move || loop {\n            let message = match ocr_result_rx.try_recv() {\n                Ok(message) => message,\n                Err(TryRecvError::Empty) | Err(TryRecvError::Disconnected) => break,\n            };\n            let Some(ui) = weak.upgrade() else { break; };\n            if message.epoch != ui.get_ocr_epoch() { continue; }\n            ui.set_ocr_running(false);\n            match message.result {\n                Ok(result) => {\n                    let line_count = result.blocks.len();\n                    let items = result.blocks.into_iter().map(|block| OcrOverlayItem {\n                        x: block.bounds.x,\n                        y: block.bounds.y,\n                        width: block.bounds.width,\n                        height: block.bounds.height,\n                        confidence: block.confidence,\n                        text: block.text.into(),\n                    }).collect::<Vec<_>>();\n                    ui.set_ocr_items(ModelRc::new(VecModel::from(items)));\n                    ui.set_ocr_text(result.plain_text.into());\n                    ui.set_ocr_line_count(line_count as i32);\n                    ui.set_ocr_overlay_visible(line_count > 0);\n                    if line_count == 0 {\n                        ui.set_status_text("Fast local OCR completed · no text found".into());\n                    } else {\n                        ui.set_status_text(format!("Fast local OCR completed · {line_count} text blocks · OCR boxes are not exported").into());\n                    }\n                }\n                Err(error) => {\n                    ui.set_ocr_overlay_visible(false);\n                    ui.set_status_text(format!("Fast local OCR failed · {error}").into());\n                }\n            }\n        });\n    }\n'''
          main = main[:event_at] + timer + main[event_at:]
          main = replace_once(
              main,
              '    ui.set_pan_y(0.0);\n    set_editor_frame(ui, latest_frame, frame.clone());',
              '    ui.set_pan_y(0.0);\n    ui.set_ocr_epoch(ui.get_ocr_epoch().wrapping_add(1));\n    ui.set_ocr_running(false);\n    ui.set_ocr_overlay_visible(false);\n    ui.set_ocr_line_count(0);\n    ui.set_ocr_text("".into());\n    set_editor_frame(ui, latest_frame, frame.clone());',
              'capture reset',
          )
          main += '''\n\nfn copy_text_to_clipboard(text: &str) -> Result<(), String> {\n    CLIPBOARD.with(|clipboard| {\n        let mut clipboard = clipboard.borrow_mut();\n        if clipboard.is_none() {\n            *clipboard = Some(Clipboard::new().map_err(|error| error.to_string())?);\n        }\n        clipboard\n            .as_mut()\n            .expect("clipboard was initialized above")\n            .set_text(text.to_owned())\n            .map_err(|error| error.to_string())\n    })\n}\n'''
          main_path.write_text(main)

          ui_path = Path('apps/desktop/ui/app.slint')
          ui = ui_path.read_text()
          ui = replace_once(ui, 'export component AppTray inherits SystemTrayIcon {', '''export struct OcrOverlayItem {\n    x: float,\n    y: float,\n    width: float,\n    height: float,\n    confidence: float,\n    text: string,\n}\n\nexport component AppTray inherits SystemTrayIcon {''', 'overlay struct')
          ui = replace_once(ui, '    in-out property <float> object-selection-height: 0;\n', '''    in-out property <float> object-selection-height: 0;\n    in-out property <[OcrOverlayItem]> ocr-items;\n    in-out property <string> ocr-text: "";\n    in-out property <int> ocr-line-count: 0;\n    in-out property <bool> ocr-overlay-visible: false;\n    in-out property <bool> ocr-running: false;\n    in-out property <int> ocr-epoch: 0;\n''', 'OCR properties')
          ui = replace_once(ui, '    callback ocr-requested();\n', '    callback ocr-requested();\n    callback copy-ocr-requested();\n', 'OCR callback')
          ui = replace_once(ui, '                if root.has-selection: selection-outline := Rectangle {', '''                for item in root.ocr-items : Rectangle {\n                    visible: root.ocr-overlay-visible;\n                    x: editor-canvas.image-offset-x + item.x * editor-canvas.image-scale * 1px;\n                    y: editor-canvas.image-offset-y + item.y * editor-canvas.image-scale * 1px;\n                    width: max(1px, item.width * editor-canvas.image-scale * 1px);\n                    height: max(1px, item.height * editor-canvas.image-scale * 1px);\n                    background: #22d3ee12;\n                    border-color: #22d3ee;\n                    border-width: 1px;\n                }\n\n                if root.has-selection: selection-outline := Rectangle {''', 'OCR overlays')
          ui = replace_once(ui, '                Button { text: "OCR"; enabled: root.has-capture; clicked => { root.ocr-requested(); } }\n', '''                Button {\n                    text: root.ocr-running ? "OCR…" : "OCR";\n                    enabled: root.has-capture && !root.ocr-running;\n                    clicked => { root.ocr-requested(); }\n                }\n                Button {\n                    text: root.ocr-overlay-visible ? "Hide OCR" : "Show OCR";\n                    enabled: root.ocr-line-count > 0;\n                    clicked => { root.ocr-overlay-visible = !root.ocr-overlay-visible; }\n                }\n                Button {\n                    text: "Copy OCR";\n                    enabled: root.ocr-line-count > 0;\n                    clicked => { root.copy-ocr-requested(); }\n                }\n''', 'OCR toolbar')
          ui_path.write_text(ui)
          PY
          cargo fmt --all

      - name: Compile desktop
        run: cargo check -p azusaocr-desktop

      - name: Commit product code and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/apply-fast-ocr.yml
          git add apps/desktop/src/main.rs apps/desktop/ui/app.slint Cargo.lock .github/workflows/ci.yml .github/workflows/apply-fast-ocr.yml
          git commit -m 'feat: integrate fast local OCR into desktop editor'
          git push origin HEAD:feat/fast-local-ocr
