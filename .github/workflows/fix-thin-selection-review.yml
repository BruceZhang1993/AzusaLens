name: Fix thin selection review

on:
  push:
    branches: [feat/precision-selection-resize]
    paths:
      - tools/fix-thin-selection-review.py
      - .github/workflows/fix-thin-selection-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/precision-selection-resize
      - name: Apply review fix
        run: python tools/fix-thin-selection-review.py
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libx11-xcb-dev libxcursor-dev libxkbcommon-x11-dev libxkbcommon-dev \
            libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo check -p azusa-lens-desktop
          cargo test -p azusa-lens-desktop
          git diff --check
      - name: Commit product changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/ui/capture-overlay.slint apps/desktop/src/overlay_tests.rs
          git rm tools/fix-thin-selection-review.py .github/workflows/fix-thin-selection-review.yml
          git commit -m "fix(capture): preserve move zone for thin selections"
          git push
