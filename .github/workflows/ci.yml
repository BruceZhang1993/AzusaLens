name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  apply-viewport:
    name: Apply viewport implementation
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/editor-zoom-pan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/editor-zoom-pan
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Apply zoom and pan viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui_path = Path('apps/desktop/ui/app.slint')
          text = ui_path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label}: expected source pattern not found')
              text = text.replace(old, new, 1)

          replace_once(
              '''    in-out property <float> capture-height: 0;
              in-out property <bool> has-selection: false;''',
              '''    in-out property <float> capture-height: 0;
              in-out property <float> zoom-factor: 1;
              in-out property <float> pan-x: 0;
              in-out property <float> pan-y: 0;
              in-out property <bool> has-selection: false;''',
              'viewport properties',
          )

          replace_once(
              '''        KeyBinding {
                  keys: @keys(Control + S);
                  enabled: !root.text-entry-visible && root.has-capture;
                  activated => { root.save-requested(); }
              }
              KeyBinding {
                  keys: @keys(Delete);''',
              '''        KeyBinding {
                  keys: @keys(Control + S);
                  enabled: !root.text-entry-visible && root.has-capture;
                  activated => { root.save-requested(); }
              }
              KeyBinding {
                  keys: @keys(Control + Plus);
                  enabled: !root.text-entry-visible && root.has-capture;
                  activated => { root.zoom-factor = min(8, root.zoom-factor * 1.2); }
              }
              KeyBinding {
                  keys: @keys(Control + Minus);
                  enabled: !root.text-entry-visible && root.has-capture;
                  activated => { root.zoom-factor = max(0.25, root.zoom-factor / 1.2); }
              }
              KeyBinding {
                  keys: @keys(Control + Digit0);
                  enabled: !root.text-entry-visible && root.has-capture;
                  activated => {
                      root.zoom-factor = 1;
                      root.pan-x = 0;
                      root.pan-y = 0;
                  }
              }
              KeyBinding {
                  keys: @keys(Delete);''',
              'zoom key bindings',
          )

          replace_once(
              '''                private property <float> canvas-width-px: self.width / 1px;
              private property <float> canvas-height-px: self.height / 1px;
              private property <float> image-scale: root.capture-width > 0 && root.capture-height > 0
                  ? min(self.canvas-width-px / root.capture-width, self.canvas-height-px / root.capture-height)
                  : 1;
              private property <length> image-display-width: root.capture-width * self.image-scale * 1px;
              private property <length> image-display-height: root.capture-height * self.image-scale * 1px;
              private property <length> image-offset-x: (self.width - self.image-display-width) / 2;
              private property <length> image-offset-y: (self.height - self.image-display-height) / 2;''',
              '''                private property <float> canvas-width-px: self.width / 1px;
              private property <float> canvas-height-px: self.height / 1px;
              private property <float> fit-scale: root.capture-width > 0 && root.capture-height > 0
                  ? min(self.canvas-width-px / root.capture-width, self.canvas-height-px / root.capture-height)
                  : 1;
              private property <length> fit-display-width: root.capture-width * self.fit-scale * 1px;
              private property <length> fit-display-height: root.capture-height * self.fit-scale * 1px;
              private property <length> fit-offset-x: (self.width - self.fit-display-width) / 2;
              private property <length> fit-offset-y: (self.height - self.fit-display-height) / 2;
              private property <float> image-scale: self.fit-scale * root.zoom-factor;
              private property <length> image-display-width: root.capture-width * self.image-scale * 1px;
              private property <length> image-display-height: root.capture-height * self.image-scale * 1px;
              private property <length> image-offset-x: (self.width - self.image-display-width) / 2 + root.pan-x * 1px;
              private property <length> image-offset-y: (self.height - self.image-display-height) / 2 + root.pan-y * 1px;''',
              'viewport transform properties',
          )

          replace_once(
              '''                if root.has-capture: Image {
                  source: root.preview-image;
                  image-fit: contain;
                  width: parent.width;
                  height: parent.height;
              }''',
              '''                if root.has-capture: Image {
                  x: editor-canvas.image-offset-x;
                  y: editor-canvas.image-offset-y;
                  width: editor-canvas.image-display-width;
                  height: editor-canvas.image-display-height;
                  source: root.preview-image;
                  image-fit: fill;
              }''',
              'viewport image',
          )

          replace_once(
              '''                if root.has-capture: TouchArea {
                  mouse-cursor: root.active-tool == "select" ? pointer : crosshair;
                  pointer-event(event) => {
                      if (event.button == PointerEventButton.left && event.kind == PointerEventKind.down) {
                          root.editor-pointer-down(self.mouse-x / 1px, self.mouse-y / 1px, self.width / 1px, self.height / 1px);
                      }
                      if (event.button == PointerEventButton.left && event.kind == PointerEventKind.up) {
                          root.editor-pointer-up(self.mouse-x / 1px, self.mouse-y / 1px, self.width / 1px, self.height / 1px);
                      }
                  }
                  moved => {
                      if (self.pressed) {
                          root.editor-pointer-moved(self.mouse-x / 1px, self.mouse-y / 1px, self.width / 1px, self.height / 1px);
                      }
                  }
              }''',
              '''                if root.has-capture: viewport-input := TouchArea {
                  private property <bool> panning: false;
                  private property <float> pan-start-x: 0;
                  private property <float> pan-start-y: 0;
                  private property <float> pointer-start-x: 0;
                  private property <float> pointer-start-y: 0;
                  private property <float> mapped-x: editor-canvas.fit-offset-x / 1px
                      + ((self.mouse-x - editor-canvas.image-offset-x) / 1px)
                          / editor-canvas.image-scale * editor-canvas.fit-scale;
                  private property <float> mapped-y: editor-canvas.fit-offset-y / 1px
                      + ((self.mouse-y - editor-canvas.image-offset-y) / 1px)
                          / editor-canvas.image-scale * editor-canvas.fit-scale;

                  mouse-cursor: root.active-tool == "select" ? pointer : crosshair;
                  pointer-event(event) => {
                      if ((event.button == PointerEventButton.middle || event.button == PointerEventButton.right)
                          && event.kind == PointerEventKind.down) {
                          self.panning = true;
                          self.pan-start-x = root.pan-x;
                          self.pan-start-y = root.pan-y;
                          self.pointer-start-x = self.mouse-x / 1px;
                          self.pointer-start-y = self.mouse-y / 1px;
                      }
                      if ((event.button == PointerEventButton.middle || event.button == PointerEventButton.right)
                          && event.kind == PointerEventKind.up) {
                          self.panning = false;
                      }
                      if (event.kind == PointerEventKind.cancel) {
                          self.panning = false;
                      }
                      if (!self.panning && event.button == PointerEventButton.left && event.kind == PointerEventKind.down) {
                          root.editor-pointer-down(self.mapped-x, self.mapped-y, self.width / 1px, self.height / 1px);
                      }
                      if (!self.panning && event.button == PointerEventButton.left && event.kind == PointerEventKind.up) {
                          root.editor-pointer-up(self.mapped-x, self.mapped-y, self.width / 1px, self.height / 1px);
                      }
                  }
                  moved => {
                      if (self.panning) {
                          root.pan-x = self.pan-start-x + self.mouse-x / 1px - self.pointer-start-x;
                          root.pan-y = self.pan-start-y + self.mouse-y / 1px - self.pointer-start-y;
                      } else if (self.pressed) {
                          root.editor-pointer-moved(self.mapped-x, self.mapped-y, self.width / 1px, self.height / 1px);
                      }
                  }
                  scroll-event(event) => {
                      if (event.delta-y < 0px) {
                          root.zoom-factor = min(8, root.zoom-factor * 1.15);
                      } else if (event.delta-y > 0px) {
                          root.zoom-factor = max(0.25, root.zoom-factor / 1.15);
                      }
                      accept
                  }
              }''',
              'viewport input',
          )

          replace_once(
              '''                        : root.active-tool == "select"
                          ? "Select objects to move, resize, recolor or delete · Esc clears selection"
                          : "Drag on the image to annotate";''',
              '''                        : root.active-tool == "select"
                          ? "Select objects to move, resize, recolor or delete · wheel zoom · middle/right drag pan"
                          : "Drag on the image to annotate · wheel zoom · middle/right drag pan";''',
              'viewport help',
          )

          replace_once(
              '''                Rectangle { horizontal-stretch: 1; background: transparent; }
              Button { text: "OCR"; enabled: root.has-capture; clicked => { root.ocr-requested(); } }''',
              '''                Rectangle { horizontal-stretch: 1; background: transparent; }
              Button {
                  text: "−";
                  enabled: root.has-capture;
                  clicked => { root.zoom-factor = max(0.25, root.zoom-factor / 1.2); }
              }
              Button {
                  text: "Fit";
                  enabled: root.has-capture;
                  clicked => {
                      root.zoom-factor = 1;
                      root.pan-x = 0;
                      root.pan-y = 0;
                  }
              }
              Button {
                  text: "+";
                  enabled: root.has-capture;
                  clicked => { root.zoom-factor = min(8, root.zoom-factor * 1.2); }
              }
              Button { text: "OCR"; enabled: root.has-capture; clicked => { root.ocr-requested(); } }''',
              'viewport buttons',
          )

          ui_path.write_text(text)

          main_path = Path('apps/desktop/src/main.rs')
          main = main_path.read_text()
          old = '''    editor.borrow_mut().reset(frame.clone());
              set_editor_frame(ui, latest_frame, frame.clone());'''
          new = '''    editor.borrow_mut().reset(frame.clone());
              ui.set_zoom_factor(1.0);
              ui.set_pan_x(0.0);
              ui.set_pan_y(0.0);
              set_editor_frame(ui, latest_frame, frame.clone());'''
          if old not in main:
              raise SystemExit('capture viewport reset: expected source pattern not found')
          main_path.write_text(main.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit viewport and restore CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add apps/desktop/ui/app.slint apps/desktop/src/main.rs .github/workflows/ci.yml
          git commit -m 'feat: add editor zoom and pan viewport'
          git push origin HEAD:feat/editor-zoom-pan

  quality:
    name: Quality (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

  platform-check:
    name: Platform check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Cargo check
        run: cargo check -p azusaocr-desktop
