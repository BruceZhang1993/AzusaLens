name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  apply-review-fixes:
    name: Apply review fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/annotation-object-editing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/annotation-object-editing
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Apply geometry fixes and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/editor.rs')
          text = path.read_text()

          replacements = [
              (
                  'Some(resize_annotation(original, old_bounds, new_bounds))',
                  'Some(resize_annotation(original, old_bounds, new_bounds, *handle))',
              ),
              (
          '''        Annotation::Rectangle { rect, .. }
                  | Annotation::Ellipse { rect, .. }
                  | Annotation::Mosaic { rect, .. }
                  | Annotation::Blur { rect, .. } => point_in_rect(point, *rect, tolerance),
                  Annotation::Arrow { from, to, style } | Annotation::Line { from, to, style } => {
                      distance_to_segment(point, *from, *to) <= tolerance + style.stroke_width / 2.0
                  }''',
          '''        Annotation::Rectangle { rect, .. }
                  | Annotation::Mosaic { rect, .. }
                  | Annotation::Blur { rect, .. } => point_in_rect(point, *rect, tolerance),
                  Annotation::Ellipse { rect, .. } => point_in_ellipse(point, *rect, tolerance),
                  Annotation::Arrow { from, to, style } => {
                      let threshold = tolerance + style.stroke_width / 2.0;
                      let (head_left, head_right) = arrow_head_points(*from, *to, *style);
                      distance_to_segment(point, *from, *to) <= threshold
                          || distance_to_segment(point, *to, head_left) <= threshold
                          || distance_to_segment(point, *to, head_right) <= threshold
                  }
                  Annotation::Line { from, to, style } => {
                      distance_to_segment(point, *from, *to) <= tolerance + style.stroke_width / 2.0
                  }''',
              ),
              (
          '''fn resize_annotation(annotation: &Annotation, old_bounds: Rect, new_bounds: Rect) -> Annotation {
              let scale_x = new_bounds.width / old_bounds.width.max(f32::EPSILON);
              let scale_y = new_bounds.height / old_bounds.height.max(f32::EPSILON);''',
          '''fn resize_annotation(
              annotation: &Annotation,
              old_bounds: Rect,
              new_bounds: Rect,
              handle: ResizeHandle,
          ) -> Annotation {
              let scale_x = new_bounds.width / old_bounds.width.max(f32::EPSILON);
              let scale_y = new_bounds.height / old_bounds.height.max(f32::EPSILON);''',
              ),
              (
                  '    let size_scale = scale_x.min(scale_y).max(0.05);',
          '''    let size_scale = match handle {
                  ResizeHandle::North | ResizeHandle::South => scale_y,
                  ResizeHandle::East | ResizeHandle::West => scale_x,
                  ResizeHandle::NorthWest
                  | ResizeHandle::NorthEast
                  | ResizeHandle::SouthEast
                  | ResizeHandle::SouthWest => {
                      if (scale_x - 1.0).abs() >= (scale_y - 1.0).abs() {
                          scale_x
                      } else {
                          scale_y
                      }
                  }
              }
              .max(0.05);''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected source pattern not found:\n{old[:180]}')
              text = text.replace(old, new, 1)

          point_marker = '''fn distance_to_segment(point: Point, from: Point, to: Point) -> f32 {'''
          helpers = '''fn point_in_ellipse(point: Point, rect: Rect, tolerance: f32) -> bool {
              if rect.width <= 0.0 || rect.height <= 0.0 {
                  return false;
              }
              let center = Point::new(
                  rect.origin.x + rect.width / 2.0,
                  rect.origin.y + rect.height / 2.0,
              );
              let radius_x = rect.width / 2.0 + tolerance.max(0.0);
              let radius_y = rect.height / 2.0 + tolerance.max(0.0);
              let dx = (point.x - center.x) / radius_x.max(f32::EPSILON);
              let dy = (point.y - center.y) / radius_y.max(f32::EPSILON);
              dx * dx + dy * dy <= 1.0
          }

          fn arrow_head_points(from: Point, to: Point, style: AnnotationStyle) -> (Point, Point) {
              let angle = (to.y - from.y).atan2(to.x - from.x);
              let head = (style.stroke_width * 5.0).clamp(12.0, 32.0);
              let spread = 0.58;
              (
                  Point::new(
                      to.x - head * (angle - spread).cos(),
                      to.y - head * (angle - spread).sin(),
                  ),
                  Point::new(
                      to.x - head * (angle + spread).cos(),
                      to.y - head * (angle + spread).sin(),
                  ),
              )
          }

          '''
          if point_marker not in text:
              raise SystemExit('distance_to_segment marker not found')
          text = text.replace(point_marker, helpers + point_marker, 1)

          test_marker = '''    #[test]
              fn sequence_marker_renders_filled_disc_with_punched_out_digit() {'''
          tests = '''    #[test]
              fn ellipse_hit_test_rejects_transparent_bounding_box_corner() {
                  let ellipse = Annotation::Ellipse {
                      rect: Rect::new(Point::new(0.0, 0.0), 100.0, 60.0),
                      style: AnnotationStyle::default(),
                  };
                  assert!(!annotation_hit_test(&ellipse, Point::new(2.0, 2.0), 1.0));
                  assert!(annotation_hit_test(&ellipse, Point::new(50.0, 30.0), 1.0));
              }

              #[test]
              fn arrow_hit_test_includes_rendered_arrowhead_segments() {
                  let style = AnnotationStyle {
                      stroke_width: 4.0,
                      ..AnnotationStyle::default()
                  };
                  let from = Point::new(10.0, 50.0);
                  let to = Point::new(80.0, 50.0);
                  let (_, head_right) = arrow_head_points(from, to, style);
                  let head_midpoint = Point::new(
                      (to.x + head_right.x) / 2.0,
                      (to.y + head_right.y) / 2.0,
                  );
                  let arrow = Annotation::Arrow { from, to, style };
                  assert!(distance_to_segment(head_midpoint, from, to) > 3.0);
                  assert!(annotation_hit_test(&arrow, head_midpoint, 1.0));
              }

              #[test]
              fn text_side_handle_resize_scales_regular_and_sequence_text() {
                  let regular = Annotation::Text {
                      origin: Point::new(10.0, 10.0),
                      value: "Resize me".to_owned(),
                      style: AnnotationStyle {
                          font_size: 30.0,
                          ..AnnotationStyle::default()
                      },
                  };
                  let regular_bounds = annotation_bounds(&regular);
                  let wider_regular = Rect::new(
                      regular_bounds.origin,
                      regular_bounds.width * 1.5,
                      regular_bounds.height,
                  );
                  let resized_regular = resize_annotation(
                      &regular,
                      regular_bounds,
                      wider_regular,
                      ResizeHandle::East,
                  );
                  match resized_regular {
                      Annotation::Text { style, .. } => assert!(style.font_size > 30.0),
                      _ => panic!("expected text annotation"),
                  }

                  let sequence = Annotation::Text {
                      origin: Point::new(50.0, 50.0),
                      value: "1".to_owned(),
                      style: AnnotationStyle {
                          stroke_width: SEQUENCE_SENTINEL_STROKE,
                          font_size: 32.0,
                          ..AnnotationStyle::default()
                      },
                  };
                  let sequence_bounds = annotation_bounds(&sequence);
                  let wider_sequence = Rect::new(
                      sequence_bounds.origin,
                      sequence_bounds.width * 1.5,
                      sequence_bounds.height,
                  );
                  let resized_sequence = resize_annotation(
                      &sequence,
                      sequence_bounds,
                      wider_sequence,
                      ResizeHandle::East,
                  );
                  match resized_sequence {
                      Annotation::Text { style, .. } => assert!(style.font_size > 32.0),
                      _ => panic!("expected sequence text annotation"),
                  }
              }

          '''
          if test_marker not in text:
              raise SystemExit('sequence marker test insertion point not found')
          text = text.replace(test_marker, tests + test_marker, 1)

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit fixes and restore CI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add apps/desktop/src/editor.rs .github/workflows/ci.yml
          git commit -m 'fix: address annotation editing review feedback'
          git push origin HEAD:feat/annotation-object-editing

  quality:
    name: Quality (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

  platform-check:
    name: Platform check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Cargo check
        run: cargo check -p azusaocr-desktop
