name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  quality:
    name: Quality (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: License compliance
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses
          arguments: --all-features
          rust-version: 1.98.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Desktop build
        run: cargo build -p azusa-lens-desktop

  native-overlay-linux:
    name: Native overlay (Linux X11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Run native overlay gate
        env:
          AZUSA_OVERLAY_QA_DIR: ${{ runner.temp }}/azusa-lens-overlay-qa
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            env SLINT_BACKEND=winit \
              AZUSA_OVERLAY_QA_DIR="$AZUSA_OVERLAY_QA_DIR" \
              cargo test -p azusa-lens-desktop native_overlay -- --ignored --nocapture

      - name: Upload overlay screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: native-overlay-linux-screenshots
          path: ${{ runner.temp }}/azusa-lens-overlay-qa
          if-no-files-found: warn

  ocr-smoke:
    name: Real OCR smoke (PP-OCRv6 Tiny)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Cache PP-OCRv6 Tiny model
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/azusa-lens-ocr
          key: ppocrv6-tiny-ocr-rs-v2.4.1-det901896-rec2251616-charset1024-total3153512-${{ runner.os }}-${{ runner.arch }}

      - name: Run real OCR gate
        env:
          AZUSA_LENS_OCR_MODEL_DIR: ${{ runner.temp }}/azusa-lens-ocr
        run: |
          cargo test -p azusa-ocr --test real_ocr -- --ignored --nocapture

  platform-check:
    name: Platform check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-

      - name: Cargo check
        run: cargo check -p azusa-lens-desktop
