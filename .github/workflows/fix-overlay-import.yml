name: Fix overlay test import

on:
  push:
    branches: [refactor/desktop-controllers]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/desktop-controllers
      - name: Import Cell explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/desktop/src/overlay_tests.rs')
          text = path.read_text()
          old = 'use std::path::PathBuf;'
          new = 'use std::{cell::Cell, path::PathBuf};'
          if old not in text:
              raise SystemExit('expected import not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src/overlay_tests.rs
          git commit -m "test(desktop): import Cell explicitly in overlay tests"
          git push origin HEAD:refactor/desktop-controllers
