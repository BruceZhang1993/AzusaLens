name: Optimize capture timestamp

on:
  push:
    branches:
      - feat/capture-workflow-polish
    paths:
      - tools/optimize_capture_timestamp.py
      - .github/workflows/optimize-capture-timestamp.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/capture-workflow-polish
          fetch-depth: 0

      - name: Apply timestamp optimization
        run: python3 tools/optimize_capture_timestamp.py

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Refresh lockfile and compile capture crate
        run: cargo check -p azusa-capture

      - name: Format Rust
        run: cargo fmt --all

      - name: Check patch
        run: git diff --check

      - name: Remove one-time patch files
        run: |
          rm tools/optimize_capture_timestamp.py
          rm .github/workflows/optimize-capture-timestamp.yml

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(capture): format screenshot names in process"
          git push origin HEAD:feat/capture-workflow-polish
