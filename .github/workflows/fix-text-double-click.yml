name: Fix text double-click priority

on:
  push:
    branches: [feat/editor-text-edit-nudge]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/editor-text-edit-nudge
          fetch-depth: 0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev libx11-dev libxcb1-dev libxkbcommon-dev
      - name: Apply fix
        run: |
          python3 .github/scripts/fix_text_double_click_priority.py
          cargo fmt --all
          cargo test -p azusa-lens-desktop regular_text_double_click_edits_in_place_and_is_undoable
      - name: Commit fix
        run: |
          rm .github/scripts/fix_text_double_click_priority.py
          rm .github/workflows/fix-text-double-click.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): prioritize text editing over resize handles"
          git push origin HEAD:feat/editor-text-edit-nudge
