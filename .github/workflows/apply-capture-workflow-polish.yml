name: Apply capture workflow polish

on:
  push:
    branches:
      - feat/capture-workflow-polish
    paths:
      - tools/apply_capture_workflow_polish.py
      - .github/workflows/apply-capture-workflow-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/capture-workflow-polish
          fetch-depth: 0

      - name: Apply source changes
        run: python3 tools/apply_capture_workflow_polish.py

      - name: Install formatter
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt

      - name: Format Rust
        run: cargo +1.98 fmt --all

      - name: Check patch
        run: git diff --check

      - name: Remove one-time patch files
        run: |
          rm tools/apply_capture_workflow_polish.py
          rm .github/workflows/apply-capture-workflow-polish.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): polish capture and save workflow"
          git push origin HEAD:feat/capture-workflow-polish
