name: Address PR 20 review feedback

on:
  push:
    branches:
      - feat/i18n-feedback-channels
    paths:
      - .github/workflows/address-pr20-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/i18n-feedback-channels
          fetch-depth: 0
      - name: Apply review fixes
        run: python3 tools/address_pr20_review.py
      - name: Format and validate
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit and clean temporary files
        run: |
          rm tools/address_pr20_review.py
          rm .github/workflows/address-pr20-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address i18n feedback review comments"
          git push origin HEAD:feat/i18n-feedback-channels
