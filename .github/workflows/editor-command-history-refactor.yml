name: Editor command history refactor

on:
  push:
    branches: [refactor/editor-command-history]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/editor-command-history
          fetch-depth: 0

      - name: Apply command-history refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          annotation_path = Path("crates/annotation/src/lib.rs")
          annotation = annotation_path.read_text()
          old_document = '''#[derive(Debug, Default, Clone, PartialEq)]
          pub struct AnnotationDocument {
              items: Vec<Annotation>,
              redo: Vec<Annotation>,
          }

          impl AnnotationDocument {
              pub fn push(&mut self, annotation: Annotation) {
                  self.items.push(annotation);
                  self.redo.clear();
              }

              pub fn undo(&mut self) -> Option<&Annotation> {
                  let item = self.items.pop()?;
                  self.redo.push(item);
                  self.redo.last()
              }

              pub fn redo(&mut self) -> Option<&Annotation> {
                  let item = self.redo.pop()?;
                  self.items.push(item);
                  self.items.last()
              }

              pub fn clear(&mut self) {
                  self.items.clear();
                  self.redo.clear();
              }

              #[must_use]
              pub fn can_undo(&self) -> bool {
                  !self.items.is_empty()
              }

              #[must_use]
              pub fn can_redo(&self) -> bool {
                  !self.redo.is_empty()
              }

              #[must_use]
              pub fn items(&self) -> &[Annotation] {
                  &self.items
              }
          }
          '''
          new_document = '''const MAX_HISTORY_ENTRIES: usize = 100;

          #[derive(Debug, Clone, PartialEq)]
          enum EditCommand {
              Insert { index: usize, annotation: Annotation },
              Remove { index: usize },
              Replace { index: usize, annotation: Annotation },
              Batch(Vec<Self>),
          }

          impl EditCommand {
              fn apply(self, items: &mut Vec<Annotation>) -> Self {
                  match self {
                      Self::Insert { index, annotation } => {
                          debug_assert!(index <= items.len());
                          items.insert(index, annotation);
                          Self::Remove { index }
                      }
                      Self::Remove { index } => {
                          debug_assert!(index < items.len());
                          let annotation = items.remove(index);
                          Self::Insert { index, annotation }
                      }
                      Self::Replace { index, annotation } => {
                          debug_assert!(index < items.len());
                          let previous = std::mem::replace(&mut items[index], annotation);
                          Self::Replace {
                              index,
                              annotation: previous,
                          }
                      }
                      Self::Batch(commands) => {
                          let inverse = commands
                              .into_iter()
                              .map(|command| command.apply(items))
                              .collect::<Vec<_>>();
                          Self::Batch(inverse.into_iter().rev().collect())
                      }
                  }
              }
          }

          #[derive(Debug, Default, Clone, PartialEq)]
          pub struct AnnotationDocument {
              items: Vec<Annotation>,
              undo: Vec<EditCommand>,
              redo: Vec<EditCommand>,
          }

          impl AnnotationDocument {
              pub fn push(&mut self, annotation: Annotation) {
                  let index = self.items.len();
                  self.execute(EditCommand::Insert { index, annotation });
              }

              pub fn extend(&mut self, annotations: impl IntoIterator<Item = Annotation>) {
                  let start = self.items.len();
                  let commands = annotations
                      .into_iter()
                      .enumerate()
                      .map(|(offset, annotation)| EditCommand::Insert {
                          index: start + offset,
                          annotation,
                      })
                      .collect::<Vec<_>>();
                  if !commands.is_empty() {
                      self.execute(EditCommand::Batch(commands));
                  }
              }

              pub fn remove(&mut self, index: usize) -> bool {
                  if index >= self.items.len() {
                      return false;
                  }
                  self.execute(EditCommand::Remove { index });
                  true
              }

              pub fn replace(&mut self, index: usize, annotation: Annotation) -> bool {
                  let Some(current) = self.items.get(index) else {
                      return false;
                  };
                  if *current == annotation {
                      return false;
                  }
                  self.execute(EditCommand::Replace { index, annotation });
                  true
              }

              pub fn undo(&mut self) -> bool {
                  let Some(command) = self.undo.pop() else {
                      return false;
                  };
                  let inverse = command.apply(&mut self.items);
                  self.redo.push(inverse);
                  true
              }

              pub fn redo(&mut self) -> bool {
                  let Some(command) = self.redo.pop() else {
                      return false;
                  };
                  let inverse = command.apply(&mut self.items);
                  self.push_undo(inverse);
                  true
              }

              pub fn clear(&mut self) -> bool {
                  if self.items.is_empty() {
                      return false;
                  }
                  let commands = (0..self.items.len())
                      .rev()
                      .map(|index| EditCommand::Remove { index })
                      .collect();
                  self.execute(EditCommand::Batch(commands));
                  true
              }

              pub fn reset(&mut self) {
                  self.items.clear();
                  self.undo.clear();
                  self.redo.clear();
              }

              #[must_use]
              pub fn can_undo(&self) -> bool {
                  !self.undo.is_empty()
              }

              #[must_use]
              pub fn can_redo(&self) -> bool {
                  !self.redo.is_empty()
              }

              #[must_use]
              pub fn items(&self) -> &[Annotation] {
                  &self.items
              }

              fn execute(&mut self, command: EditCommand) {
                  let inverse = command.apply(&mut self.items);
                  self.push_undo(inverse);
                  self.redo.clear();
              }

              fn push_undo(&mut self, command: EditCommand) {
                  if self.undo.len() >= MAX_HISTORY_ENTRIES {
                      self.undo.remove(0);
                  }
                  self.undo.push(command);
              }
          }
          '''
          annotation = replace_once(annotation, old_document, new_document, "annotation document")

          test_anchor = '''    #[test]
              fn line_render_changes_pixels() {
          '''
          test_insert = '''    #[test]
              fn history_tracks_replace_remove_batch_and_clear() {
                  let mut document = AnnotationDocument::default();
                  let first = Annotation::Line {
                      from: Point::new(0.0, 0.0),
                      to: Point::new(8.0, 8.0),
                      style: AnnotationStyle::default(),
                  };
                  let second = Annotation::Rectangle {
                      rect: Rect::new(Point::new(2.0, 3.0), 10.0, 12.0),
                      style: AnnotationStyle::default(),
                  };

                  document.push(first.clone());
                  assert!(document.replace(0, second.clone()));
                  assert_eq!(document.items(), &[second.clone()]);
                  assert!(document.undo());
                  assert_eq!(document.items(), &[first.clone()]);
                  assert!(document.redo());
                  assert_eq!(document.items(), &[second.clone()]);

                  assert!(document.remove(0));
                  assert!(document.items().is_empty());
                  assert!(document.undo());
                  assert_eq!(document.items(), &[second.clone()]);

                  document.extend([first.clone(), second.clone()]);
                  assert_eq!(document.items().len(), 3);
                  assert!(document.undo());
                  assert_eq!(document.items(), &[second.clone()]);
                  assert!(document.redo());
                  assert_eq!(document.items().len(), 3);

                  assert!(document.clear());
                  assert!(document.items().is_empty());
                  assert!(document.undo());
                  assert_eq!(document.items().len(), 3);
              }

              #[test]
              fn reset_discards_items_and_history() {
                  let mut document = AnnotationDocument::default();
                  document.push(Annotation::Line {
                      from: Point::new(0.0, 0.0),
                      to: Point::new(8.0, 8.0),
                      style: AnnotationStyle::default(),
                  });
                  document.reset();
                  assert!(document.items().is_empty());
                  assert!(!document.can_undo());
                  assert!(!document.can_redo());
              }

              #[test]
              fn line_render_changes_pixels() {
          '''
          annotation = replace_once(annotation, test_anchor, test_insert, "annotation history tests")
          annotation_path.write_text(annotation)

          editor_path = Path("apps/desktop/src/editor.rs")
          editor = editor_path.read_text()
          editor = replace_once(editor, 'const MAX_HISTORY_ENTRIES: usize = 100;\n', '', "editor history limit")
          editor = replace_once(
              editor,
              '''    selection_preview: Option<Annotation>,
              undo_history: Vec<AnnotationDocument>,
              redo_history: Vec<AnnotationDocument>,
          ''',
              '''    selection_preview: Option<Annotation>,
          ''',
              "editor history fields",
          )
          editor = replace_once(
              editor,
              '''            selection_preview: None,
                  undo_history: Vec::new(),
                  redo_history: Vec::new(),
          ''',
              '''            selection_preview: None,
          ''',
              "editor history defaults",
          )
          editor = replace_once(
              editor,
              '''        self.document.clear();
                  self.undo_history.clear();
                  self.redo_history.clear();
          ''',
              '''        self.document.reset();
          ''',
              "editor reset history",
          )
          editor = replace_once(
              editor,
              '''    pub fn can_undo(&self) -> bool {
                  !self.undo_history.is_empty()
              }

              #[must_use]
              pub fn can_redo(&self) -> bool {
                  !self.redo_history.is_empty()
              }
          ''',
              '''    pub fn can_undo(&self) -> bool {
                  self.document.can_undo()
              }

              #[must_use]
              pub fn can_redo(&self) -> bool {
                  self.document.can_redo()
              }
          ''',
              "editor history status",
          )
          editor = replace_once(
              editor,
              '''        self.record_history();
                  self.committed_rgba = Some(next_pixels);
                  if let Some(preview) = self.preview.as_mut() {
                      for annotation in &annotations {
                          preview.apply(annotation)?;
                      }
                  }
                  for annotation in annotations {
                      self.document.push(annotation);
                  }
          ''',
              '''        self.committed_rgba = Some(next_pixels);
                  if let Some(preview) = self.preview.as_mut() {
                      for annotation in &annotations {
                          preview.apply(annotation)?;
                      }
                  }
                  self.document.extend(annotations);
          ''',
              "editor OCR batch history",
          )

          old_delete = '''    pub fn delete_selected(&mut self) -> Result<Option<CapturedFrame>, String> {
              self.cancel_draft();
              let Some(index) = self.selected_index.take() else {
                  return Ok(None);
              };
              let mut items = self.document.items().to_vec();
              if index >= items.len() {
                  return Ok(None);
              }
              self.record_history();
              items.remove(index);
              self.document = document_from_items(items);
              self.rebuild_committed()?;
              self.recompute_sequence_next();
              self.current_frame().map(Some)
          }
          '''
          new_delete = '''    pub fn delete_selected(&mut self) -> Result<Option<CapturedFrame>, String> {
              self.cancel_draft();
              let Some(index) = self.selected_index.take() else {
                  return Ok(None);
              };
              if !self.document.remove(index) {
                  return Ok(None);
              }
              self.rebuild_committed()?;
              self.recompute_sequence_next();
              self.current_frame().map(Some)
          }
          '''
          editor = replace_once(editor, old_delete, new_delete, "editor delete")

          old_undo_redo = '''    pub fn undo(&mut self) -> Result<Option<CapturedFrame>, String> {
              self.cancel_draft();
              let Some(previous) = self.undo_history.pop() else {
                  return Ok(None);
              };
              let current = self.snapshot_document();
              self.redo_history.push(current);
              self.document = previous;
              self.selected_index = None;
              self.rebuild_committed()?;
              self.recompute_sequence_next();
              self.current_frame().map(Some)
          }

              pub fn redo(&mut self) -> Result<Option<CapturedFrame>, String> {
                  self.cancel_draft();
                  let Some(next) = self.redo_history.pop() else {
                      return Ok(None);
                  };
                  let current = self.snapshot_document();
                  self.push_undo_snapshot(current);
                  self.document = next;
                  self.selected_index = None;
                  self.rebuild_committed()?;
                  self.recompute_sequence_next();
                  self.current_frame().map(Some)
              }
          '''
          new_undo_redo = '''    pub fn undo(&mut self) -> Result<Option<CapturedFrame>, String> {
              self.cancel_draft();
              if !self.document.undo() {
                  return Ok(None);
              }
              self.selected_index = None;
              self.rebuild_committed()?;
              self.recompute_sequence_next();
              self.current_frame().map(Some)
          }

              pub fn redo(&mut self) -> Result<Option<CapturedFrame>, String> {
                  self.cancel_draft();
                  if !self.document.redo() {
                      return Ok(None);
                  }
                  self.selected_index = None;
                  self.rebuild_committed()?;
                  self.recompute_sequence_next();
                  self.current_frame().map(Some)
              }
          '''
          editor = replace_once(editor, old_undo_redo, new_undo_redo, "editor undo redo")
          editor = replace_once(editor, '        self.record_history();\n        self.document.clear();\n', '        self.document.clear();\n', "editor clear history")

          old_replace = '''    fn replace_annotation(&mut self, index: usize, replacement: Annotation) -> Result<(), String> {
              let mut items = self.document.items().to_vec();
              let Some(current) = items.get(index) else {
                  self.selected_index = None;
                  return Ok(());
              };
              if *current == replacement {
                  return Ok(());
              }
              self.record_history();
              items[index] = replacement;
              self.document = document_from_items(items);
              self.rebuild_committed()?;
              self.recompute_sequence_next();
              Ok(())
          }
          '''
          new_replace = '''    fn replace_annotation(&mut self, index: usize, replacement: Annotation) -> Result<(), String> {
              let Some(current) = self.document.items().get(index) else {
                  self.selected_index = None;
                  return Ok(());
              };
              if *current == replacement {
                  return Ok(());
              }
              if !self.document.replace(index, replacement) {
                  self.selected_index = None;
                  return Ok(());
              }
              self.rebuild_committed()?;
              self.recompute_sequence_next();
              Ok(())
          }
          '''
          editor = replace_once(editor, old_replace, new_replace, "editor replace")
          editor = replace_once(editor, '        self.record_history();\n        let base = self\n', '        let base = self\n', "editor apply history")

          old_history_helpers = '''    fn record_history(&mut self) {
              let snapshot = self.snapshot_document();
              self.push_undo_snapshot(snapshot);
              self.redo_history.clear();
          }

              fn push_undo_snapshot(&mut self, snapshot: AnnotationDocument) {
                  if self.undo_history.len() >= MAX_HISTORY_ENTRIES {
                      self.undo_history.remove(0);
                  }
                  self.undo_history.push(snapshot);
              }

              fn snapshot_document(&self) -> AnnotationDocument {
                  document_from_items(self.document.items().iter().cloned())
              }

          '''
          editor = replace_once(editor, old_history_helpers, '', "editor history helpers")

          old_document_helper = '''fn document_from_items(items: impl IntoIterator<Item = Annotation>) -> AnnotationDocument {
              let mut document = AnnotationDocument::default();
              for annotation in items {
                  document.push(annotation);
              }
              document
          }

          '''
          editor = replace_once(editor, old_document_helper, '', "editor document helper")

          forbidden = ["undo_history", "redo_history", "record_history", "snapshot_document", "document_from_items"]
          leftovers = [name for name in forbidden if name in editor]
          if leftovers:
              raise SystemExit(f"editor history leftovers: {leftovers}")
          editor_path.write_text(editor)
          PY

          cargo fmt --all
          cargo test -p azusa-annotation --lib
          cargo test -p azusa-lens-desktop

      - name: Commit refactor
        shell: bash
        run: |
          rm .github/workflows/editor-command-history-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(editor): centralize command-based annotation history"
          git push origin HEAD:refactor/editor-command-history
