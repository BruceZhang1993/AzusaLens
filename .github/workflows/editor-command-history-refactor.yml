name: Editor command history refactor

on:
  push:
    branches: [refactor/editor-command-history]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/editor-command-history
          fetch-depth: 0

      - name: Apply command-history refactor
        run: |
          python3 .github/scripts/refactor_editor_history.py
          cargo fmt --all
          cargo test -p azusa-annotation --lib

      - name: Commit refactor
        run: |
          rm .github/workflows/editor-command-history-refactor.yml
          rm .github/scripts/refactor_editor_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(editor): centralize command-based annotation history"
          git push origin HEAD:refactor/editor-command-history
