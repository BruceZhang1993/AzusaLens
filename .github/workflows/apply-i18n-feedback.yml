name: Apply i18n feedback

on:
  push:
    branches: [feat/i18n-feedback-channels]
    paths:
      - tools/apply_i18n_feedback.py
      - .github/workflows/apply-i18n-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/i18n-feedback-channels
          fetch-depth: 0

      - name: Apply integration
        run: |
          python3 tools/apply_i18n_feedback.py
          python3 - <<'PY'
          from pathlib import Path

          main = Path("apps/desktop/src/main.rs")
          text = main.read_text(encoding="utf-8")
          text = text.replace(
              '                    let notification_body = format!("Saved edited PNG · {}", path.display());\n                    show_system_notification("Image saved", &notification_body);\n',
              '',
          )
          main.write_text(text, encoding="utf-8")

          i18n = Path("apps/desktop/src/i18n.rs")
          text = i18n.read_text(encoding="utf-8")
          old = '''        if let Some(dimensions) = value.strip_suffix(" · ready to annotate") {
              return format!("已截图 {dimensions} · 可以开始标注");
          }
          if let Some(dimensions) = value.strip_suffix(" · copied to clipboard · ready to annotate") {
              return format!("已截图 {dimensions} · 已复制到剪贴板 · 可以开始标注");
          }
          if let Some((dimensions, error)) = value.split_once(" · clipboard failed: ")
              && let Some(error) = error.strip_suffix(" · ready to annotate")
          {
              return format!("已截图 {dimensions} · 复制到剪贴板失败：{error} · 可以开始标注");
          }
          '''
          new = '''        if let Some(dimensions) = value.strip_suffix(" · copied to clipboard · ready to annotate") {
              return format!("已截图 {dimensions} · 已复制到剪贴板 · 可以开始标注");
          }
          if let Some((dimensions, error)) = value.split_once(" · clipboard failed: ")
              && let Some(error) = error.strip_suffix(" · ready to annotate")
          {
              return format!("已截图 {dimensions} · 复制到剪贴板失败：{error} · 可以开始标注");
          }
          if let Some(dimensions) = value.strip_suffix(" · ready to annotate") {
              return format!("已截图 {dimensions} · 可以开始标注");
          }
          '''
          if old not in text:
              raise SystemExit("capture status localization block not found")
          i18n.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev \
            libgbm-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt

      - name: Format
        run: |
          sed -i 's/[[:space:]]\+$//' apps/desktop/src/main.rs apps/desktop/src/hotkeys.rs
          cargo fmt --all

      - name: Validate
        run: |
          cargo check -p azusa-lens-desktop
          cargo test -p azusa-config --lib
          cargo test -p azusa-lens-desktop
          git diff --check

      - name: Remove one-time integration files
        run: |
          rm -f tools/i18n_inventory.py tools/i18n_inventory.txt
          rm -f tools/apply_i18n_feedback.py
          rm -f .github/workflows/i18n-inventory.yml
          rm -f .github/workflows/apply-i18n-feedback.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): add i18n and unified feedback channels"
          git push origin HEAD:feat/i18n-feedback-channels
