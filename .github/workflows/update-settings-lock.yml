name: Update settings lockfile

on:
  push:
    branches:
      - feat/settings-persistence

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Refresh workspace lockfile
        run: cargo check -p azusa-config
      - name: Commit lockfile when changed
        run: |
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Cargo.lock for settings crate"
          git push origin HEAD:feat/settings-persistence
