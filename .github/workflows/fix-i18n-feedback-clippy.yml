name: Fix i18n feedback clippy

on:
  push:
    branches: [feat/i18n-feedback-channels]
    paths:
      - .github/workflows/fix-i18n-feedback-clippy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/i18n-feedback-channels
          fetch-depth: 0

      - name: Apply needless-borrow fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              Path("apps/desktop/src/hotkeys.rs"): [
                  (
                      'feedback::set_status_text(\n                &ui,\n                format!("Saved shortcut is invalid',
                      'feedback::set_status_text(\n                ui,\n                format!("Saved shortcut is invalid',
                  ),
                  (
                      'feedback::set_status_text(\n            &ui,\n            format!("Registering screenshot shortcut',
                      'feedback::set_status_text(\n            ui,\n            format!("Registering screenshot shortcut',
                  ),
              ],
              Path("apps/desktop/src/main.rs"): [
                  (
                      'feedback::set_status_text(\n            &ui,\n            format!("Captured {dimensions} · ready to annotate',
                      'feedback::set_status_text(\n            ui,\n            format!("Captured {dimensions} · ready to annotate',
                  ),
                  (
                      'feedback::set_status_text(\n            &ui,\n            format!("Captured {dimensions} · copied to clipboard',
                      'feedback::set_status_text(\n            ui,\n            format!("Captured {dimensions} · copied to clipboard',
                  ),
                  (
                      'feedback::set_status_text(\n            &ui,\n            format!("Captured {dimensions} · clipboard failed',
                      'feedback::set_status_text(\n            ui,\n            format!("Captured {dimensions} · clipboard failed',
                  ),
              ],
          }

          for path, replacements in fixes.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f"{path}: target not found uniquely: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-i18n-feedback-clippy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: remove needless feedback borrows"
          git push origin HEAD:feat/i18n-feedback-channels
