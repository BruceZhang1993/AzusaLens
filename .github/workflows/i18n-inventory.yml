name: I18n inventory

on:
  push:
    branches: [feat/i18n-feedback-channels]
    paths:
      - tools/i18n_inventory.py
      - .github/workflows/i18n-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/i18n-feedback-channels
          fetch-depth: 0
      - run: python3 tools/i18n_inventory.py
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/i18n_inventory.txt
          git commit -m "chore: record i18n inventory"
          git push origin HEAD:feat/i18n-feedback-channels
