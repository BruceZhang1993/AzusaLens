name: Implement editor text and nudge

on:
  push:
    branches: [feat/editor-text-edit-nudge]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/editor-text-edit-nudge
          fetch-depth: 0
      - name: Apply editor interaction changes
        run: |
          python3 .github/scripts/implement_editor_text_nudge.py
          cargo fmt --all
      - name: Commit implementation
        run: |
          rm .github/scripts/implement_editor_text_nudge.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(editor): edit text and nudge selected annotations"
          git push origin HEAD:feat/editor-text-edit-nudge
