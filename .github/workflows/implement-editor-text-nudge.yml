name: Finalize editor text and nudge

on:
  push:
    branches: [feat/editor-text-edit-nudge]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/editor-text-edit-nudge
          fetch-depth: 0
      - name: Apply final fixes
        run: python3 .github/scripts/fix_editor_text_nudge.py
      - name: Commit implementation
        run: |
          rm .github/scripts/fix_editor_text_nudge.py
          rm .github/workflows/implement-editor-text-nudge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): finalize text editing and nudge interactions"
          git push origin HEAD:feat/editor-text-edit-nudge
